; ============================================================================
; subtareas.ini — Plantillas de prompts del orquestador de subtareas
; ============================================================================
; Este fichero contiene las plantillas de prompt que el orquestador inyecta
; para cada tipo de subtarea del flujo de descomposición.
;
; Si el fichero existe, hercules.py carga las plantillas desde aquí.
; Si no existe, se utilizan las plantillas por defecto definidas en el código.
;
; Secciones (deben coincidir con los valores del enum SubtaskType):
;   [REQUIREMENTS]            -> Requisitos técnicos
;   [DEVELOPMENT]             -> Desarrollo de la solución
;   [EXECUTION_VERIFICATION]  -> Ejecución y comprobación
;   [RECTIFICATION]           -> Rectificación de la solución
;
; Cada sección contiene una clave "prompt" con la plantilla. Las líneas de
; continuación dentro de un valor deben ir indentadas (espacios o tabulación)
; para que configparser las trate como parte del valor anterior.
;
; Las plantillas usan placeholders estilo str.format() que el orquestador
; sustituye en tiempo de ejecución:
;   {user_prompt}            - Prompt original del usuario
;   {requirements}           - Salida de la subtarea de requisitos
;   {solution}               - Salida de la subtarea de desarrollo
;   {previous_solution}      - Solución anterior que falló
;   {verification_errors}    - Errores reportados por la verificación
; ============================================================================

[REQUIREMENTS]
prompt = Eres un analista técnico. Tu única misión en esta subtarea es producir un documento de REQUISITOS TÉCNICOS (debe llamarse requisitos_tecnicos.md) para la tarea del usuario indicada más abajo.

    REGLAS:
    1. Averigua siempre el entorno antes de actuar (sistema operativo, software disponible que sea necesario, etc) y deja constancia en el documento.
    2. NO modifiques otros archivos. Solo analiza y documenta.
    3. Tu respuesta final debe ser un documento estructurado con:
       - Objetivo principal
       - Restricciones y dependencias
       - Archivos a crear o modificar (con rutas relativas al workspace)
       - Comandos a ejecutar (si aplica)
       - Criterios de aceptación verificables
       - Compatibilidad con sistema operativo y software presente en el entorno
       - Al diseñar las soluciones define el proyecto en ficheros separados pequeños para evitar problemas de contexto (cuando sea posible)
    4. Sé conciso pero completo. Usa listas y secciones claras.

    TAREA DEL USUARIO:
    {user_prompt}

[DEVELOPMENT]
prompt = Eres un desarrollador. Tu misión es implementar la solución basándote en los REQUISITOS TÉCNICOS (fichero requisitos_tecnicos.md) proporcionados.

    REGLAS:
    1. Sigue los requisitos al pie de la letra.
    2. Cuando termines la implementación, proporciona una respuesta final concisa describiendo qué has creado/modificado y dónde.
    3. NO verifiques la solución (eso lo hará la siguiente subtarea).
    4. No ejecutes acciones que puedan eliminar o modificar datos o el propio sistema operativo.

    REQUISITOS TÉCNICOS:
    {requirements}

    TAREA ORIGINAL DEL USUARIO:
    {user_prompt}

[EXECUTION_VERIFICATION]
prompt = Eres un verificador. Tu misión es EJECUTAR y COMPROBAR que la solución implementada cumple los requisitos técnicos (fichero requisitos_tecnicos.md).

    REGLAS:
    1. Compara el resultado con los criterios de aceptación de los requisitos.
    2. Tu respuesta final debe comenzar EXACTAMENTE con una de estas dos líneas (sin preámbulo):
       - 'VERIFICACIÓN EXITOSA: ...' (seguido de un resumen breve)
       - 'VERIFICACIÓN FALLIDA: ...' (seguido de la lista detallada de errores o problemas encontrados)
    3. Sé objetivo: si hay cualquier error, fallo de comando, archivo faltante o comportamiento inesperado, marca como FALLIDA.
    4. No ejecutes acciones que puedan eliminar o modificar datos o el propio sistema operativo.

    SOLUCIÓN IMPLEMENTADA:
    {solution}

    REQUISITOS TÉCNICOS:
    {requirements}

    TAREA ORIGINAL DEL USUARIO:
    {user_prompt}

[RECTIFICATION]
prompt = Eres un desarrollador en modo corrección. La solución anterior ha FALLADO la verificación. Tu misión es producir una versión CORREGIDA de la solución.

    REGLAS:
    1. Analiza cuidadosamente los errores reportados.
    2. NO repitas los mismos errores: cambia la estrategia si es necesario.
    3. Cuando termines, proporciona una respuesta final concisa describiendo qué has corregido y por qué.
    4. No ejecutes acciones que puedan eliminar o modificar datos o el propio sistema operativo.

    ERRORES REPORTADOS EN LA VERIFICACIÓN:
    {verification_errors}

    SOLUCIÓN ANTERIOR (que falló):
    {previous_solution}

    REQUISITOS TÉCNICOS:
    {requirements}

    TAREA ORIGINAL DEL USUARIO:
    {user_prompt}
