; ============================================================================
; subtareas.ini — Plantillas de prompts del orquestador de subtareas
; ============================================================================
; Este fichero contiene las plantillas de prompt que el orquestador inyecta
; para cada tipo de subtarea del flujo de descomposición.
;
; Este fichero es la única fuente del plan. Si falta, está vacío o
; contiene errores, el orquestador no lanza subtareas.
;
; Define el plan en el orden de las secciones. Puedes crear, quitar,
; renombrar o reordenar etapas; cada sección con prompt es una subtarea
; y el nombre de la sección será el nombre visible de la subtarea.
;
; Cada sección contiene una clave "prompt". Las líneas de continuación
; dentro de un valor deben ir indentadas.
;
; Placeholders disponibles (los desconocidos se dejan sin modificar):
;   {user_prompt}            - Prompt original del usuario
;   {NOMBRE_SECCION}         - Salida de cualquier subtarea previa
; ============================================================================

[EJECUTAR]
prompt = Realiza la tarea solicitada por el usuario siguiendo estas instrucciones:

	1. Crea un fichero md (markdown) con la información de la tarea.
	2. Realiza la tarea solicitada completamente.
	3. Verifica que la tarea cumpla los requisitos solicitados por el usuario.

    PETICIÓN DEL USUARIO:
    {user_prompt}