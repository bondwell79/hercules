; ============================================================================
; config.ini — Configuración de gestor_agentes.py
; ============================================================================
; Este fichero mantiene la configuración persistente del agente.
; Las variables de entorno tienen prioridad sobre los valores de este fichero.
; ============================================================================

[LLM]
; Modo de operación del LLM:
;   local  -> carga el modelo GGUF directamente con llama-cpp-python
;             (sin endpoint HTTP, inferencia en proceso).
;   http   -> envía solicitudes a un endpoint compatible con
;             /v1/chat/completions (OpenAI / Ollama / llama.cpp server).
mode = http

; URL base del endpoint compatible con OpenAI / Ollama / llama.cpp
; (solo se usa cuando mode = http)
base_url = http://localhost:8080/v1

; Clave de API (dejar vacía para Ollama local)
api_key =

; Modelo a invocar (identificador enviado al endpoint en modo http)
model = Qwen3.5-35B-A3B-APEX-Mini.gguf

; Directorio donde se encuentran los modelos .gguf (solo se usa cuando mode = local).
; El nombre del archivo concreto se toma del campo 'model' de arriba.
; También puede indicarse la ruta completa al archivo .gguf.
model_path = ./modelos

; Timeout de la petición HTTP en segundos (solo modo http)
timeout = 120

; Tamaño de contexto (tokens) para el modelo local
n_ctx = 8192

; Número de hilos CPU para inferencia local
n_threads = 8

; Capas a descargar en GPU (0 = solo CPU, -1 = todas)
n_gpu_layers = 0

[Workspace]
; Directorio restringido para operaciones de archivos del agente
path = ./workspace

[Database]
; Ruta del fichero SQLite de persistencia
path = gestor_agentes.db

[Agent]
; Número máximo de iteraciones del bucle ReAct por tarea.
; Si se alcanza este límite sin obtener una respuesta final del LLM,
; la tarea se clasifica automáticamente como FAILED.
max_iterations = 50

; Umbral de detección de bucles. Si el modelo repite la misma respuesta
; (contenido + tool_calls) este número de veces o más, se compacta
; automáticamente el contexto para permitirle replantear su estrategia.
loop_threshold = 5

; Número máximo de reintentos del ciclo de rectificación.
; Cuando la subtarea "Ejecución y comprobación" falla, el orquestador
; crea una subtarea "Rectificación de la solución" y vuelve a ejecutar
; la comprobación. Este valor limita cuántas veces se repite ese ciclo
; antes de marcar la tarea padre como FAILED.
max_rectification_retries = 3

; Umbral de compactación preventiva del contexto (porcentaje, 1-100).
; Antes de enviar el contexto al modelo, se estima el número de tokens
; consumidos. Si supera este porcentaje del límite configurado en
; n_ctx, se compacta el contexto automáticamente para evitar que el
; modelo se quede sin espacio o degrade la calidad de la respuesta.
; La compactación por bucle (loop_threshold) sigue funcionando de
; forma independiente.
context_compact_threshold = 80

[UI]
; Ventana en pantalla completa al iniciar (true/false)
fullscreen = true

; --------------------------------------------------------------------------
; Colores de la interfaz (formato CSS: nombre o #RRGGBB)
; Todos los colores de los objetos de la UI se definen aquí.
; Los objetos se diferencian únicamente por su color de fondo (sin bordes).
; --------------------------------------------------------------------------

; Color de fondo de la ventana principal
bg_color = #1e1e1e

; Color del texto principal (etiquetas, cabeceras, etc.)
fg_color = #e0e0e0

; Color de fondo de los marcos contenedores (frames de nivel superior)
frame_bg = #252526

; Color de fondo de los paneles/tarjetas (zonas de contenido)
card_bg = #2d2d30

; Color de fondo del campo de prompt (zona superior)
prompt_bg = #1e1e1e

; Color del texto del campo de prompt
prompt_fg = #e0e0e0

; Color de fondo del panel de historial (zona inferior)
history_bg = #1e1e1e

; Color del texto del panel de historial
history_fg = #d4d4d4

; Color de fondo del panel de aprobación HITL
approval_bg = #1e1e1e

; Color del texto del panel de aprobación HITL
approval_fg = #b6eea8

; -------------------------------------------------------------------
; Colores del panel de aprobación según el estado de la solicitud.
; Esquema: fondo blanco + texto de color (alto contraste sobre el
; panel oscuro del dashboard).
; -------------------------------------------------------------------

; Solicitud pendiente (aún sin decisión del usuario)
approval_request_bg = #1e1e1e
approval_request_fg = #a88647

; Solicitud aprobada por el usuario
approval_granted_bg = #1e1e1e
approval_granted_fg = #388e3c

; Solicitud denegada por el usuario
approval_denied_bg = #1e1e1e
approval_denied_fg = #d32f2f

; -------------------------------------------------------------------
; Colores del texto en el historial de tarea (un color por tipo de
; evento). El fondo del historial se controla con history_bg/fg.
; -------------------------------------------------------------------

; Respuesta final del agente (en negrita)
final_answer_fg = #4caf50

; Pensamientos / razonamiento del agente (en cursiva)
thought_fg = #e65100

; Mensajes informativos (recordatorios, iteraciones, etc.)
info_fg = #fbc02d

; Llamadas a herramientas
tool_call_fg = #4fc3f7

; Resultados de herramientas
tool_result_fg = #80cbc4

; Errores del agente o del LLM
error_fg = #ef5350

; Cambios de estado de la tarea
status_change_fg = #b0bec5

; Detección de bucle en las respuestas del modelo
loop_detected_fg = #ce93d8

; Compactación del contexto tras detectar un bucle
context_compacted_fg = #ce93d8

; --------------------------------------------------------------------------
; Colores de los estados de tarea (etiquetas de estado en el tablero)
; --------------------------------------------------------------------------
status_pending = #9e9e9e
status_in_progress = #4fc3f7
status_awaiting_approval = #ffb74d
status_completed = #66bb6a
status_failed = #ef5350
status_cancelled = #9e9e9e

; --------------------------------------------------------------------------
; Tipografía
; --------------------------------------------------------------------------

; Familia de fuente
font_family = Segoe UI

; Tamaño de fuente base
font_size = 10

; Familia de fuente monoespaciada (prompt, historial, argumentos)
mono_font_family = Consolas

; Tamaño de la fuente monoespaciada
mono_font_size = 10

; -------------------------------------------------------------------
; Colores de la barra de uso de contexto (debajo del historial de
; tarea). El color de relleno cambia según el porcentaje estimado
; de contexto ocupado por la tarea seleccionada.
; -------------------------------------------------------------------

; Color de fondo de la barra (canal)
context_bar_bg = #e0e0e0

; Color de relleno cuando el uso es bajo (< 60%)
context_bar_low = #4caf50

; Color de relleno cuando el uso es medio (60% - 85%)
context_bar_medium = #ff9800

; Color de relleno cuando el uso es alto (> 85%)
context_bar_high = #f44336

; -------------------------------------------------------------------
; Colores del explorador de ficheros (Treeview)
; -------------------------------------------------------------------

; Color de fondo del área donde aparecen los ficheros y carpetas
browser_bg = #2d2d30

; Color del texto de los nombres de ficheros y carpetas
browser_fg = #e0e0e0

; Color de fondo de la cabecera del explorador (Nombre / Tamaño)
browser_header_bg = #252526

; Color de fondo de la fila seleccionada
browser_selected_bg = #264f78

; Color del texto de la fila seleccionada
browser_selected_fg = #ffffff

; -------------------------------------------------------------------
; Colores de los botones (Ejecutar, Limpiar, Ver, Permitir, Cancelar,
; Refrescar, Padre, etc.). Afecta a todos los estilos derivados de
; TButton (Execute.TButton, Allow.TButton, Deny.TButton).
; -------------------------------------------------------------------
button_bg = #3c3c3c
button_fg = #e0e0e0

; -------------------------------------------------------------------
; Colores de las casillas de verificación (Checkbutton).
; Se usan en la casilla "Preautorizar" del panel de aprobación y en
; la casilla "No mostrar este mensaje" del popup de bienvenida.
; -------------------------------------------------------------------
checkbox_bg = #2d2d30
checkbox_fg = #e0e0e0
